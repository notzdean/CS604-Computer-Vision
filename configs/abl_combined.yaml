# Ablation C of 3 (equal budget, about 5% of backbone): LoRA r=12 on qkv + AdaptFormer bottleneck 208 = 4.998%.
# The same design as lora_adaptformer.yaml, with epochs fixed at 10 so it matches abl_lora_only and abl_adaptformer_only.
# Also the base config for the one-change-at-a-time tuning runs (label smoothing, head init, lr) via EXTRA.
name: abl_combined
method: lora_adaptformer
method_args: {lora_r: 12, lora_alpha: 24, bottleneck: 208, scale: 0.1}
epochs: 10
budget_hours: auto
batch_size: 128
lr: 3.0e-4
head_lr_mult: 1.0
weight_decay: 0.01
label_smoothing: 0.0
head_init: true
notes: "ablation C: LoRA + AdaptFormer at about 5%"
