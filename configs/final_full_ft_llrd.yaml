# Final full fine-tuning model (queue run 37): full_ft_llrd_10ep (76.06% hold-out, 77.67% at 288 px) trained on ALL 45
# images per class (holdout_per_class 0): 4.7% more training data, like final_5pct_trivialaug for the 5% track.
# Why 10 epochs and not the full budget: run 32 showed 10 epochs score within 0.2 of 18.2 (76.06 vs 76.26), with a
# lower hold-out loss (1.304 vs 1.468), at half the cost.
# No hold-out: the run cannot be scored locally (hold-out columns stay empty); it is judged on the leaderboard only.
# Submit at 288 px (+1.61 for run 32): python -m common.submit <run> --team XX --split test --size 288
# GPU: A100 40 GB preferred (about 1.2 h of 2.4 h). On an 80 GB card (budget 1.2 h, stop at 1.3 h) it should still fit
# (about 1.17 h: run 32 took 1.20 h for 33,590 steps including ten hold-out evaluations; this run has 35,150 steps and none).
# Checkpoints are the whole model (about 1.1 GB), so they are only saved once per epoch.
name: final_full_ft_llrd
method: full_ft
epochs: 10
budget_hours: auto
batch_size: 128
lr: 1.0e-4
head_lr_mult: 0.3
layer_decay: 0.75
weight_decay: 0.05
label_smoothing: 0.1
head_init: true
ckpt_every_steps: 1000000
holdout_per_class: 0
notes: "final full fine-tuning model: full_ft_llrd_10ep on all 45 images per class (no hold-out)"
