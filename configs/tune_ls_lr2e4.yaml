# Combination run: abl_combined with the TWO changes that each helped on their own:
# label smoothing 0.1 (tune_label_smoothing) and learning rate 2e-4 (tune_lr_low).
# One change away from each of those two runs, so it shows whether the gains add up.
name: tune_ls_lr2e4
method: lora_adaptformer
method_args: {lora_r: 12, lora_alpha: 24, bottleneck: 208, scale: 0.1}
epochs: 10
budget_hours: auto
batch_size: 128
lr: 2.0e-4
head_lr_mult: 1.0
weight_decay: 0.01
label_smoothing: 0.1
head_init: true
notes: "combination: label smoothing 0.1 + lr 2e-4"
