# BitFit (train only the bias terms, about 0.12% of the backbone, + the head) with the tuned 5% recipe of
# imp_trivialaug: label smoothing 0.1, head at 5e-5, TrivialAugment + random erasing, 10 epochs, 224 px.
# Why: one more method from the brief, and a point between the linear probe (0%, 62.62%) and the 5% design
# (74.28%) on the parameters-vs-accuracy chart, under the same recipe.
# One deliberate difference: the bias lr is 5e-4 instead of 1e-4, because biases are few and shift slowly (BitFit
# papers use about 1e-3). head_lr_mult 0.1 keeps the head at the tuned 5e-5 (5e-4 x 0.1), as in imp_trivialaug.
# GPU: A100 40 GB preferred (about 1.3 h; loader-bound like imp_trivialaug).
name: imp_bitfit
method: bitfit
epochs: 10
budget_hours: auto
batch_size: 128
lr: 5.0e-4
head_lr_mult: 0.1
weight_decay: 0.01         # as imp_trivialaug; it only reaches the head's weight matrix (biases are never decayed)
label_smoothing: 0.1
head_init: true
auto_augment: trivial
re_prob: 0.25
notes: "BitFit with the imp_trivialaug recipe (bias lr 5e-4, head 5e-5)"
