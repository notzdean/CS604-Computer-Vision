# Fair-comparison run: full_ft_baseline with ONE change, label smoothing 0.1.
# Why: label smoothing helped the 5% design, so the full fine-tuning baseline gets the same trick before the two
# are compared in the report. Checkpoints are the whole model (about 1.1 GB), so they are only saved once per epoch.
name: full_ft_ls
method: full_ft
epochs: null            # null -> as many epochs as fit in the budget (96 GB-hours / GPU size)
budget_hours: auto
batch_size: 128
lr: 3.0e-5
head_lr_mult: 10.0
weight_decay: 0.05
label_smoothing: 0.1
head_init: true
ckpt_every_steps: 1000000
notes: "full fine-tuning + label smoothing 0.1 (fair comparison)"
