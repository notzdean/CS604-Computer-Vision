# Tuning run: abl_combined with ONE change: label smoothing 0.1 (baseline 0.0).
# Why: the LoRA run became over-confident (training loss 0.12 while the hold-out loss rose). Compare with abl_combined.
name: tune_label_smoothing
method: lora_adaptformer
method_args: {lora_r: 12, lora_alpha: 24, bottleneck: 208, scale: 0.1}
epochs: 10
budget_hours: auto
batch_size: 128
lr: 3.0e-4
head_lr_mult: 1.0
weight_decay: 0.01
label_smoothing: 0.1
head_init: true
notes: "tuning: label smoothing 0.1 vs abl_combined"
